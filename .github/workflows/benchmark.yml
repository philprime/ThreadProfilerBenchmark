name: Profiler benchmark

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmark (${{ matrix.target }})
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [macos, simulator]
    defaults:
      run:
        shell: bash
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TARGET: ${{ matrix.target }}
      RESULTS_DIR: Results/ci-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install just
        run: brew install just

      - name: Configure credential-free builds
        run: |
          config="$RUNNER_TEMP/benchmark.xcconfig"
          printf '%s\n' \
            'CODE_SIGN_IDENTITY = -' \
            'CODE_SIGN_STYLE = Manual' \
            'DEVELOPMENT_TEAM =' \
            'MACOSX_DEPLOYMENT_TARGET = 27.0' \
            > "$config"
          echo "XCODE_XCCONFIG_FILE=$config" >> "$GITHUB_ENV"

      - name: Record runner environment
        run: |
          mkdir -p "$RESULTS_DIR"
          {
            sw_vers
            uname -m
            xcodebuild -version
            just --version
          } > "$RESULTS_DIR/environment.txt"

      - name: Select iPhone Simulator
        if: matrix.target == 'simulator'
        id: simulator
        run: |
          udid=$(xcrun simctl list devices available --json | jq -er '
            [.devices["com.apple.CoreSimulator.SimRuntime.iOS-27-2"][]
              | select(.name == "iPhone 18 Pro")]
            | if length == 1 then .[0].udid
              else error("Expected one iPhone 18 Pro on iOS 27.2") end
          ')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Run A/B benchmark
        id: benchmark
        env:
          SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
        run: |
          if [[ "$TARGET" == "simulator" ]]; then
            just --set simulator "$SIMULATOR_UDID" benchmark simulator
          else
            just benchmark macos
          fi

      - name: Publish results
        if: always()
        env:
          BENCHMARK_OUTCOME: ${{ steps.benchmark.outcome }}
        run: bash scripts/report-benchmark.sh "$TARGET" "$BENCHMARK_OUTCOME"

      - name: Upload reports and build logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: benchmark-${{ matrix.target }}
          path: ${{ env.RESULTS_DIR }}/
          if-no-files-found: warn
          retention-days: 14
